<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>PASTI KAYA - Financial Dashboard</title>

    <!-- Google Fonts: Jomhuria & Montserrat -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Jomhuria&family=Montserrat:wght@500;600;700&display=swap"
        rel="stylesheet">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Phosphor Icons -->
    <script src="https://unpkg.com/@phosphor-icons/web"></script>

    <style>
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #0d0d0d;
            color: #ffffff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .font-jomhuria {
            font-family: 'Jomhuria', cursive;
            line-height: 0.85;
        }

        .font-montserrat-semibold {
            font-family: 'Montserrat', sans-serif;
            font-weight: 600;
        }

        /* Standard Android Compact Container */
        .mobile-container {
            width: 100%;
            max-width: 412px;
            background-color: #1a1a1a;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>

<body class="bg-black text-white antialiased">

    <div class="mobile-container pb-20">

        <!-- HEADER / TOP BAR WITH LOGO & TITLE (SMOOTH & PRESISI FIGMA) -->
        <div class="flex items-center justify-between px-4 pt-4 pb-2">

            <!-- Left Section: Logo + Title PASTI KAYA (Ukuran Kompak) -->
            <div class="flex items-center gap-2 relative group">

                <!-- Logo Container (w-12 h-12) -->
                <div class="w-14 h-14 flex-shrink-0 flex items-center justify-center relative">
                    <img id="headerLogoImg" src="https://via.placeholder.com/100x100/1a1a1a/FBBE21?text=LOGO" alt="Logo"
                        class="w-full h-full object-contain">

                    <!-- Control Buttons Floating Under Logo (Nongol Pas di Bawah Logo) -->
                    <div id="logoControls"
                        class="absolute top-full left-0 mt-1 z-30 flex items-center gap-1 bg-black/95 border border-[#FBBE21]/60 px-1.5 py-0.5 rounded-md backdrop-blur-md shadow-2xl whitespace-nowrap">
                        <!-- Button 1: Upload Logo -->
                        <label for="logoUpload" title="Upload Logo"
                            class="text-[#FBBE21] text-[10px] font-montserrat-semibold flex items-center gap-0.5 cursor-pointer hover:opacity-80">
                            <i class="ph ph-upload-simple text-xs"></i>
                            <span>Upload</span>
                        </label>
                        <input type="file" id="logoUpload" accept="image/*" class="hidden"
                            onchange="previewHeaderLogo(event)">

                        <span class="text-neutral-600 text-[10px]">|</span>

                        <!-- Button 2: Eye Icon to Hide Controls -->
                        <button type="button" onclick="hideLogoControls()" title="Sembunyikan Tombol Ini"
                            class="text-[#FBBE21] hover:text-red-400 transition-colors flex items-center justify-center p-0.5">
                            <i class="ph ph-eye text-xs"></i>
                        </button>
                    </div>
                </div>

                <!-- Title & 2 Double Underlines -->
                <div class="flex flex-col justify-center">
                    <h1
                        class="font-jomhuria font-normal text-[28px] leading-[0.7] tracking-[-0.5px] text-[#FBBE21] uppercase select-none">
                        PASTI KAYA
                    </h1>

                    <!-- 2 Garis Kuning (Double Lines Rapat Presisi Foto 2) -->
                    <div class="flex flex-col gap-[2px] -mt-1.5 w-full">
                        <!-- Garis 1: Panjang & Tebal (#FBBD1F) -->
                        <div class="h-[2px] bg-[#FBBD1F] w-full"></div>
                        <!-- Garis 2: Pendek & Tipis (#DAA520) -->
                        <div class="h-[1.5px] bg-[#DAA520] w-[60%]"></div>
                    </div>
                </div>

            </div>

            <!-- Right Section: Action Icons Warna #CE970C -->
            <div class="flex items-center gap-2.5">
                <!-- Headphone Support (#CE970C) -->
                <button class="text-[#CE970C] hover:opacity-80 transition-opacity">
                    <i class="ph ph-headset text-2xl"></i>
                </button>
                <!-- Question Mark Circle (#CE970C) -->
                <button
                    class="w-6 h-6 rounded-full border-[1.5px] border-[#CE970C] flex items-center justify-center text-[#CE970C] font-bold text-xs hover:opacity-80 transition-opacity">
                    ?
                </button>
            </div>

        </div>

        <!-- TOTAL ASSET SECTION -->
        <div class="px-4 mt-3">
            <p class="font-montserrat-semibold text-gray-400 text-sm">Total Asset</p>
            <h2 class="font-montserrat-semibold text-[28px] text-[#FBBE21] tracking-tight leading-tight mt-0.5">
                Rp 10.000.000
            </h2>
        </div>

        <!-- ACTION BUTTONS (BUY, SELL, MORE) -->
        <div class="grid grid-cols-3 gap-2.5 px-4 mt-4">
            <button
                class="py-2 rounded-lg border border-[#FBBE21] text-[#FBBE21] font-montserrat-semibold text-sm hover:bg-[#FBBE21] hover:text-black transition-all">
                Buy
            </button>
            <button
                class="py-2 rounded-lg border border-[#FBBE21] text-[#FBBE21] font-montserrat-semibold text-sm hover:bg-[#FBBE21] hover:text-black transition-all">
                Sell
            </button>
            <button
                class="py-2 rounded-lg border border-[#FBBE21] text-[#FBBE21] font-montserrat-semibold text-sm hover:bg-[#FBBE21] hover:text-black transition-all">
                More
            </button>
        </div>

        <!-- SUBTITLE TEXT -->
        <div class="px-4 mt-4 text-center">
            <p class="font-montserrat-semibold text-[#FBBE21] text-sm tracking-wide">
                duit loe lagi gw puter
            </p>
        </div>

        <!-- CANDLESTICK CHART CONTAINER -->
        <div class="px-4 mt-3">
            <div class="bg-[#141414] border border-neutral-800 rounded-xl p-3 relative overflow-hidden">

                <!-- Y-Axis Values & Grid Lines -->
                <div class="relative w-full h-[180px] flex flex-col justify-between py-1">

                    <!-- Horizontal Grid Lines -->
                    <div class="absolute inset-0 flex flex-col justify-between pointer-events-none opacity-20">
                        <div class="border-b border-gray-400 w-full"></div>
                        <div class="border-b border-gray-400 w-full"></div>
                        <div class="border-b border-gray-400 w-full"></div>
                        <div class="border-b border-gray-400 w-full"></div>
                        <div class="border-b border-gray-400 w-full"></div>
                    </div>

                    <!-- Y-Axis Labels -->
                    <div
                        class="absolute left-0 top-0 bottom-0 flex flex-col justify-between text-[9px] text-gray-500 font-mono">
                        <span>105</span>
                        <span>100</span>
                        <span>95</span>
                        <span>90</span>
                        <span>85</span>
                    </div>

                    <!-- Candlestick SVG Graphic -->
                    <svg class="w-full h-full pl-6 pt-1 pb-1" viewBox="0 0 300 180" preserveAspectRatio="none">
                        <!-- Red Candles (Downtrend) & Gold Candles -->
                        <line x1="20" y1="20" x2="20" y2="100" stroke="#ef4444" stroke-width="1.5" />
                        <rect x="17" y="30" width="6" height="50" fill="#ef4444" rx="1" />

                        <line x1="35" y1="50" x2="35" y2="120" stroke="#ef4444" stroke-width="1.5" />
                        <rect x="32" y="60" width="6" height="40" fill="#ef4444" rx="1" />

                        <line x1="50" y1="70" x2="50" y2="130" stroke="#FBBE21" stroke-width="1.5" />
                        <rect x="47" y="80" width="6" height="35" fill="#FBBE21" rx="1" />

                        <line x1="65" y1="60" x2="65" y2="140" stroke="#ef4444" stroke-width="1.5" />
                        <rect x="62" y="75" width="6" height="50" fill="#ef4444" rx="1" />

                        <line x1="80" y1="80" x2="80" y2="135" stroke="#FBBE21" stroke-width="1.5" />
                        <rect x="77" y="90" width="6" height="30" fill="#FBBE21" rx="1" />

                        <line x1="95" y1="70" x2="95" y2="145" stroke="#ef4444" stroke-width="1.5" />
                        <rect x="92" y="85" width="6" height="45" fill="#ef4444" rx="1" />

                        <line x1="110" y1="90" x2="110" y2="150" stroke="#FBBE21" stroke-width="1.5" />
                        <rect x="107" y="100" width="6" height="35" fill="#FBBE21" rx="1" />

                        <line x1="125" y1="110" x2="125" y2="170" stroke="#ef4444" stroke-width="1.5" />
                        <rect x="122" y="120" width="6" height="40" fill="#ef4444" rx="1" />

                        <line x1="140" y1="120" x2="140" y2="175" stroke="#ef4444" stroke-width="1.5" />
                        <rect x="137" y="130" width="6" height="35" fill="#ef4444" rx="1" />

                        <line x1="155" y1="100" x2="155" y2="165" stroke="#FBBE21" stroke-width="1.5" />
                        <rect x="152" y="110" width="6" height="40" fill="#FBBE21" rx="1" />

                        <line x1="170" y1="125" x2="170" y2="178" stroke="#ef4444" stroke-width="1.5" />
                        <rect x="167" y="135" width="6" height="35" fill="#ef4444" rx="1" />
                    </svg>

                </div>

                <!-- X-Axis Timestamps -->
                <div class="flex justify-between pl-6 text-[9px] text-gray-500 font-mono mt-1">
                    <span>1</span>
                    <span>8</span>
                    <span>15</span>
                    <span>22</span>
                    <span>2930</span>
                </div>

            </div>
        </div>

        <!-- BANNER IMAGE SECTION (Stroberi 11 Gacor) -->
        <div class="px-4 mt-4 mb-5">
            <div class="text-center mb-1.5">
                <span class="font-montserrat-semibold text-gray-300 text-xs">Stroberi 11 Gacor</span>
            </div>
            <div
                class="relative w-full h-[150px] rounded-xl overflow-hidden border border-neutral-800 bg-neutral-900 flex items-center justify-center group">
                <img id="bannerImg"
                    src="https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?q=80&w=800&auto=format&fit=crop"
                    alt="Stroberi 11 Gacor" class="w-full h-full object-cover">

                <!-- Interactive Upload File Trigger -->
                <label for="imgUpload"
                    class="absolute bottom-2 right-2 bg-black/80 hover:bg-black text-[#FBBE21] text-[10px] font-montserrat-semibold px-2.5 py-1 rounded-lg border border-[#FBBE21]/40 cursor-pointer shadow-lg transition-all">
                    <i class="ph ph-upload-simple mr-1"></i> Ganti JPG
                </label>
                <input type="file" id="imgUpload" accept="image/*" class="hidden" onchange="previewImage(event)">
            </div>
        </div>

        <!-- BOTTOM NAVIGATION BAR (FIXED AT BOTTOM) -->
        <div
            class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[412px] bg-[#121212] border-t border-neutral-800 px-6 py-2.5 flex justify-between items-center z-50">

            <!-- Home -->
            <button class="flex flex-col items-center gap-1 text-[#FBBE21]">
                <i class="ph-fill ph-house text-xl"></i>
            </button>

            <!-- Market / Store -->
            <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-[#FBBE21] transition-colors">
                <i class="ph ph-storefront text-xl"></i>
            </button>

            <!-- Wallet -->
            <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-[#FBBE21] transition-colors">
                <i class="ph ph-wallet text-xl"></i>
            </button>

            <!-- Profile -->
            <button class="flex flex-col items-center gap-1 text-gray-400 hover:text-[#FBBE21] transition-colors">
                <i class="ph ph-user text-xl"></i>
            </button>

        </div>

    </div>

    <!-- JavaScript Image Handlers -->
    <script>
        // Handler Preview Header Logo Upload
        function previewHeaderLogo(event) {
            const reader = new FileReader();
            reader.onload = function () {
                const output = document.getElementById('headerLogoImg');
                output.src = reader.result;
            };
            if (event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }

        // Handler Sembunyikan Tombol Control Logo saat Mata Ditekan
        function hideLogoControls() {
            const controls = document.getElementById('logoControls');
            if (controls) {
                controls.style.display = 'none';
            }
        }

        // Handler Banner Image Preview
        function previewImage(event) {
            const reader = new FileReader();
            reader.onload = function () {
                const output = document.getElementById('bannerImg');
                output.src = reader.result;
            };
            if (event.target.files[0]) {
                reader.readAsDataURL(event.target.files[0]);
            }
        }
    </script>

</body>

</html>
